name: Build Release

on:
  push:
    branches: [ master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công bất cứ lúc nào trên giao diện web GitHub

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Ghim phiên bản để bản build CI giống máy phát triển.
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK Release
        # CI chưa có keystore: cho phép rõ ràng bản thử nghiệm ký debug key.
        # Khi thêm keystore qua secrets thì bỏ biến này.
        env:
          VNVAR_ALLOW_DEBUG_SIGNING: 'true'
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        # Hết dung lượng lưu artifact thì vẫn chạy tiếp các bước kiểm tra.
        continue-on-error: true
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          # APK đã nén sẵn; giữ ngắn để không đầy hạn mức lưu trữ của GitHub.
          compression-level: 0
          retention-days: 3

      - name: Check APK for Google Play (targetSdk, permissions, 16 KB pages)
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission"
          python3 tool/check_16kb_page_size.py "$APK"

      - name: Build App Bundle (Google Play)
        # Google Play nhận .aab. Bản này chỉ hợp lệ để tải lên khi ký bằng upload
        # key thật (android/key.properties hoặc VNVAR_KEYSTORE_* qua secrets).
        env:
          VNVAR_ALLOW_DEBUG_SIGNING: 'true'
        run: flutter build appbundle --release
      # Chưa tải .aab lên artifact: bản này ký debug key nên Play không nhận,
      # chỉ build để chắc chắn bundle hợp lệ. Khi có keystore qua secrets thì
      # thêm bước upload-artifact cho build/app/outputs/bundle/release/app-release.aab.

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.0'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          cd ios
          pod install --repo-update
          cd ..
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r SportO-Cam-iOS.ipa Payload
          rm -rf Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SportO-Cam-iOS-ipa
          path: SportO-Cam-iOS.ipa
          compression-level: 0
          retention-days: 3
