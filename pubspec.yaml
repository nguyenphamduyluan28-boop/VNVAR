name: camera_station
description: "VNVAR Camera Station"
publish_to: 'none'

version: 1.0.1+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  shelf: ^1.4.2
  bonsoir: ^7.1.5
  shared_preferences: ^2.3.3
  flutter_webrtc: ^1.5.2
  ffmpeg_kit_flutter_new_video: ^2.5.2
  video_player: ^2.14.0
  wakelock_plus: ^1.2.8


dev_dependencies:
  change_app_package_name: ^1.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/LogoApp_SportOCam.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/LogoApp_SportOCam.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/vnvar_logo.png
    - assets/images/LogoApp_SportOCam.png
