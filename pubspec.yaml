name: camera_station
description: "VNVAR Camera Station"
publish_to: 'none'

version: 1.0.1+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_webrtc: ^1.5.2
  ffmpeg_kit_flutter_new_video: ^2.5.2
  video_player: ^2.14.0
  wakelock_plus: ^1.2.8
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.4


# Bản flutter_webrtc 1.6.0 có vá bitrate và profile H.264 của trình ghi video
# (xem các dòng "VNVAR patch" trong packages/flutter_webrtc).
dependency_overrides:
  flutter_webrtc:
    path: packages/flutter_webrtc

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/LogoApp_SportOCam.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/LogoApp_SportOCam.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/vnvar_logo.png
    - assets/images/LogoApp_SportOCam.png
